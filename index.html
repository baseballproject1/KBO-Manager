<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KBO 매니저</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">


<h1>⚾ KBO 매니저</h1>


<div id="teamSelect">

<h2>응원할 구단을 선택하세요</h2>


<button onclick="selectTeam('SSG')">
⚾ SSG 랜더스
</button>


<button onclick="selectTeam('LG')">
⚾ LG 트윈스
</button>


<button onclick="selectTeam('삼성')">
⚾ 삼성 라이온즈
</button>


<button onclick="selectTeam('두산')">
⚾ 두산 베어스
</button>


<button onclick="selectTeam('KIA')">
⚾ KIA 타이거즈
</button>


<button onclick="selectTeam('KT')">
⚾ KT 위즈
</button>


<button onclick="selectTeam('롯데')">
⚾ 롯데 자이언츠
</button>


<button onclick="selectTeam('한화')">
⚾ 한화 이글스
</button>


<button onclick="selectTeam('키움')">
⚾ 키움 히어로즈
</button>


<button onclick="selectTeam('NC')">
⚾ NC 다이노스
</button>


</div>





<div id="mainGame" style="display:none;">



<div class="status">


<h2 id="teamName"></h2>


<p>
💰 자금 :
<span id="money">
0
</span>억
</p>


<p>
🎴 뽑기권 :
<span id="ticket">
0
</span>장
</p>


</div>





<div class="menu">


<button onclick="showTeam()">
👥 선수단
</button>


<button onclick="draw()">
🎴 뽑기
</button>


<button onclick="showGame()">
🏟 경기
</button>


<button onclick="showSeason()">
🏆 시즌
</button>


<button onclick="showFA()">
💼 FA
</button>


<button onclick="showMission()">
📋 미션
</button>


<button onclick="showAttendance()">
📅 출석
</button>


<button onclick="saveGame()">
💾 저장
</button>


</div>





<div id="screen">

<h2>
게임 시작!
</h2>

</div>



</div>



</div>





<script src="teams.js"></script>

<script src="players.js"></script>

<script src="save.js"></script>

<script src="game.js"></script>


</body>

</html>
