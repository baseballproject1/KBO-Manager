<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>KBO 매니저</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

<h1>⚾ KBO 매니저</h1>

<div class="status">

<h2>SSG 랜더스</h2>

<p>💰 자금 : <span id="money">150</span>억</p>
<p>🎴 일반 뽑기권 : <span id="ticket">30</span>장</p>

</div>


<div class="menu">

<button onclick="showTeam()">👥 선수단</button>

<button onclick="draw()">🎴 뽑기</button>

<button onclick="showGame()">🏟 경기</button>
  
<button onclick="showSeason()">🏆 시즌</button>
  
<button onclick="saveGame()">💾 저장</button>

</div>


<div id="screen">

<h2>환영합니다!</h2>

<p>나만의 야구단을 운영하세요.</p>

</div>


</div>


<script src="game.js"></script>

</body>
</html>
